name: OTA Update (Tanpa Reinstall)

on:
  # Update OTA otomatis setiap push ke main
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Pesan update (opsional)'
        required: false
        default: 'Update terbaru'

jobs:
  update:
    name: Push OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Push OTA update ke device
        run: |
          MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message }}"
          eas update --branch preview --message "$MESSAGE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
