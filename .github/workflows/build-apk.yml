name: Build APK

on:
  # Build otomatis setiap push ke main
  push:
    branches: [main]
  # Atau trigger manual dari GitHub UI
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS
        run: eas build --platform android --profile preview --non-interactive --output ./build/app-preview.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: latihan-soal-cpns-${{ github.sha }}
          path: ./build/app-preview.apk
          retention-days: 30
